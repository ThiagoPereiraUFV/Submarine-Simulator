name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # freeglut/GLU to build, Xvfb for the headless GL smoke tests, lcov for
      # the 100% coverage gate.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freeglut3-dev libglu1-mesa-dev mesa-common-dev \
            xvfb lcov clang-format clang-tidy

      - name: Lint and format check
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Coverage (gates at 100% lines)
        run: make coverage
